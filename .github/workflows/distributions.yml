name: Distributions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check-docs.py "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Check HTML and local links
        if: steps.changes.outputs.docs_only == 'true'
        run: python3 .github/scripts/check-docs.py
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.11'
      - name: Build wheel and source archive
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install build
          python -m build
      - name: Test the extracted source archive
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          mkdir "$RUNNER_TEMP/source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"/openweb_benchmark_news-*
          test -f .env.example
          test -f ATTRIBUTION.md
          test -f INSTALL.md
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover('.')
          if suite.countTestCases() == 0:
              raise SystemExit('No tests discovered in the source archive')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Smoke-test the installed wheel outside the checkout
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/openweb-news" example --output "$RUNNER_TEMP/example"
