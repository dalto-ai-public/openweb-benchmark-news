[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openweb-benchmark-news"
version = "0.1.0"
description = "Standalone own-evidence news retrieval benchmark runner"
authors = [{name = "Dalto"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openweb-news = "openweb_news.cli:main"

[tool.setuptools.packages.find]
include = ["openweb_news*"]

[tool.setuptools.package-data]
openweb_news = ["assets/*.json", "assets/*.md", "assets/fixtures/*.json"]
